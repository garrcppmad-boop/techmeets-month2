name: CI/CD Pipeline

# ブランチと環境の対応
#   week9/refactoring   → ステージング環境（staging）
#   week6/laravel-setup → 本番環境（production）※リポジトリのデフォルトブランチ
on:
  push:
    branches: [ week9/refactoring, week6/laravel-setup ]
  pull_request:
    branches: [ week6/laravel-setup ]
  workflow_dispatch:

# 同じブランチで新しい push があったら、古い実行は止める（デプロイ中は止めない）
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.2'   # 本番の Docker イメージ（php:8.2-fpm）に合わせる

jobs:
  # ---------------------------------------------------------------
  # ステップ1: Lint（PHP CS Fixer / PHPStan）
  # ---------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: PHP環境のセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: cs2pr   # エラーを PR の差分上に注釈として表示する

      - name: Composerの依存関係をインストール
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP CS Fixer（コード整形チェック）
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --format=checkstyle | cs2pr

      - name: PHPStan（静的解析）
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

  # ---------------------------------------------------------------
  # ステップ2: テスト（PHPUnit + カバレッジ）
  # ---------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: PHP環境のセットアップ（PCOV でカバレッジ計測）
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
          # 計測対象を明示（未指定だと src/ があるとそちらを計測してしまう）
          ini-values: pcov.directory=app

      - name: Composerの依存関係をインストール
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: .envファイルの作成
        run: |
          cp .env.example .env
          php artisan key:generate

      # DB は phpunit.xml の設定で SQLite（インメモリ）を使う
      - name: テスト実行（カバレッジ計測付き）
        run: |
          vendor/bin/phpunit \
            --coverage-text=coverage/coverage.txt \
            --coverage-clover=coverage/clover.xml \
            --coverage-html=coverage/html

      - name: カバレッジレポートを Actions の Summary に表示
        if: always() && hashFiles('coverage/clover.xml') != ''
        run: |
          php -r '
            $m = simplexml_load_file("coverage/clover.xml")->project->metrics;
            $pct = $m["statements"] > 0 ? 100 * $m["coveredstatements"] / $m["statements"] : 0;
            printf("COVERAGE=%.1f\n", $pct);
          ' >> "$GITHUB_ENV"
          {
            echo "## 📊 テストカバレッジ"
            echo
            echo '```'
            sed -n '/Summary:/,/^$/p' coverage/coverage.txt
            echo '```'
            echo
            echo "<details><summary>クラスごとのカバレッジ</summary>"
            echo
            echo '```'
            sed '1,/Summary:/d' coverage/coverage.txt | sed '1,/^$/d'
            echo '```'
            echo "</details>"
            echo
            echo "HTML レポートはこの実行の **Artifacts → coverage-report** からダウンロードできます。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: カバレッジのHTMLレポートを保存
        if: always() && hashFiles('coverage/clover.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: カバレッジ 70% 以上かチェック
        run: |
          echo "カバレッジ: ${COVERAGE}%"
          php -r 'exit((float) getenv("COVERAGE") >= 70 ? 0 : 1);' \
            || { echo "::error::カバレッジが 70% 未満です（${COVERAGE}%）"; exit 1; }

  # ---------------------------------------------------------------
  # ステップ2': セキュリティスキャン（Trivy）
  #   本番用 Dockerfile からイメージをビルドし、脆弱性・Dockerfile の設定ミスを検査する
  #   修正版がある HIGH / CRITICAL の脆弱性が見つかったら失敗させる
  # ---------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: 本番用イメージをビルド
        run: docker build -t laravel-app:ci .

      - name: Trivy でイメージの脆弱性をスキャン
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: laravel-app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy で Dockerfile の設定ミスをスキャン
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ---------------------------------------------------------------
  # ステップ3: デプロイ
  #   Lint・テスト・セキュリティスキャンがすべて成功したときだけ実行する
  #   接続情報は GitHub の Environments（staging / production）ごとの Secrets に登録する
  # ---------------------------------------------------------------
  deploy-staging:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    needs: [ lint, test, security ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/week9/refactoring'
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: デプロイ先の設定を確認
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::warning::staging 環境の Secrets（SSH_HOST など）が未登録のため、デプロイをスキップしました"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: サーバーにSSH接続してデプロイ
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ vars.APP_DIR || '~/app' }}
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git pull --ff-only origin ${{ github.ref_name }}
            # CSS/JS をビルド（public/build を生成）。サーバーに Node.js を入れずに Docker で実行する
            docker run --rm -v "$PWD":/app -w /app -e CYPRESS_INSTALL_BINARY=0 node:22-alpine sh -c "npm ci --no-audit --no-fund && npm run build"
            docker compose -f docker-compose.yml up -d --build
            docker compose -f docker-compose.yml exec -T app composer install --no-dev --optimize-autoloader --no-interaction
            docker compose -f docker-compose.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.yml exec -T app php artisan view:cache

  deploy-production:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: [ lint, test, security ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/week6/laravel-setup'
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: デプロイ先の設定を確認
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::warning::production 環境の Secrets（SSH_HOST など）が未登録のため、デプロイをスキップしました"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: サーバーにSSH接続してデプロイ
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ vars.APP_DIR || '~/app' }}
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git pull --ff-only origin ${{ github.ref_name }}
            # CSS/JS をビルド（public/build を生成）。サーバーに Node.js を入れずに Docker で実行する
            docker run --rm -v "$PWD":/app -w /app -e CYPRESS_INSTALL_BINARY=0 node:22-alpine sh -c "npm ci --no-audit --no-fund && npm run build"
            docker compose -f docker-compose.yml up -d --build
            docker compose -f docker-compose.yml exec -T app composer install --no-dev --optimize-autoloader --no-interaction
            docker compose -f docker-compose.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.yml exec -T app php artisan view:cache
