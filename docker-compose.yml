services:
  # Nginx（Webサーバー）
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  # PHP-FPM（アプリケーション）
  #
  # DB 接続情報はここに書かない。Laravel が読み込む .env の DB_* が
  # そのまま使われる（本番では .env を RDS のエンドポイントに向ける）。
  # ローカル開発用の DB コンテナと DB_* の上書きは docker-compose.override.yml 側で行う。
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    networks:
      - app-network

# 仮想ネットワーク（同じネットワーク内のコンテナはサービス名で通信できる）
networks:
  app-network:
    driver: bridge
