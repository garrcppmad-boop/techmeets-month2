services:
  # Nginx（Webサーバー）
  nginx:
    image: nginx:latest
    # ローカルは "0.0.0.0:80" のまま、EC2(本番)は .env で
    # NGINX_BIND_ADDRESS=127.0.0.1 / NGINX_PORT=8080 を設定し、
    # ホスト Nginx からのみ到達可能にする（docker-compose.yml 自体は共通）。
    ports:
      - "${NGINX_BIND_ADDRESS:-0.0.0.0}:${NGINX_PORT:-80}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  # PHP-FPM（アプリケーション）
  #
  # DB 接続情報はここに書かない。Laravel が読み込む .env の DB_* が
  # そのまま使われる（本番では .env を RDS のエンドポイントに向ける）。
  # ローカル開発用の DB コンテナと DB_* の上書きは docker-compose.override.yml 側で行う。
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    networks:
      - app-network

# 仮想ネットワーク（同じネットワーク内のコンテナはサービス名で通信できる）
networks:
  app-network:
    driver: bridge
