server {
    listen 80;                        # ポート80でリクエストを受け付ける
    server_name localhost;
    root /var/www/html/public;        # Laravelの公開ディレクトリ（public/index.phpが入口）

    index index.php index.html;

    # テキスト系のレスポンスを gzip 圧縮して転送量を減らす（HTML は常に圧縮対象）
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Vite でビルドした CSS/JS はファイル名にハッシュが付く（中身が変わると名前も変わる）ので、
    # ブラウザに1年間キャッシュさせても古いファイルが使われる心配がない
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        # URLに対応するファイルがなければindex.phpに渡す（Laravelのルーティング用）
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # PHPファイルはappコンテナ（PHP-FPM）の9000番ポートに転送する
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;                     # .htaccessへのアクセスを拒否（セキュリティ）
    }
}