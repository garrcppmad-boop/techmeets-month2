# ==============================================================================
# EC2 ホスト側 Nginx 設定（リバースプロキシ + TLS 終端）
#   構成: ホスト Nginx (80/443, TLS終端) -> Docker コンテナ内 Nginx (127.0.0.1:8080) -> PHP-FPM
#
#   配置先 : /etc/nginx/sites-available/laravel-app.conf
#   有効化 : sudo ln -s /etc/nginx/sites-available/laravel-app.conf \
#                       /etc/nginx/sites-enabled/laravel-app.conf
#            sudo rm -f /etc/nginx/sites-enabled/default
#            sudo nginx -t && sudo systemctl reload nginx
#
#   注意   : example.com は取得した独自ドメインに全置換すること。
#            ssl_certificate 系の行は Certbot 実行後に有効なパスになる。
# ==============================================================================

# HTTP: ACME チャレンジは素通しし、それ以外は全て HTTPS へ 301 リダイレクト
#
#   重要: return 301 は location / { } の中に書くこと。server { } の直下に
#   直接書くと、nginx は server-rewrite フェーズ（location 振り分けより前）で
#   return を評価してしまうため、/.well-known/acme-challenge/ へのアクセスも
#   HTTPS 側へ飛ばされてしまい、Certbot の更新（renew）が失敗する。
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

# www あり -> www なし（HTTPS）へ 301
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://example.com$request_uri;
}

# 本体（www なし）-> Docker コンテナ内 Nginx へリバースプロキシ
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
