# ==============================================================================
# EC2 ホスト側 Nginx 設定（リバースプロキシ + TLS 終端）
#
#   配置先 : /etc/nginx/sites-available/laravel-app.conf
#   有効化 : sudo ln -s /etc/nginx/sites-available/laravel-app.conf \
#                       /etc/nginx/sites-enabled/laravel-app.conf
#            sudo rm -f /etc/nginx/sites-enabled/default
#            sudo nginx -t && sudo systemctl reload nginx
#
#   前提1 : docker-compose.yml の nginx コンテナを "127.0.0.1:8080:80" に変更済み
#           （ホスト Nginx が 80/443 を持ち、コンテナには localhost からだけ通す）
#   前提2 : 下記の example.com を取得した独自ドメインに全置換すること
#   前提3 : ssl_certificate 系の行は Certbot 実行後に有効なパスになる。
#           初回は「STEP A」の HTTP のみ構成で起動 → Certbot → 「STEP B」を有効化。
# ==============================================================================


# ------------------------------------------------------------------------------
# STEP A : 証明書取得前。これだけ入れて nginx -t / reload し、Certbot を実行する。
#          （STEP B のブロックはコメントアウトしておく）
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Let's Encrypt (webroot) の ACME チャレンジ用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 証明書取得後は下 1 行を有効化して HTTP を全て HTTPS へ 301（要件: 自動リダイレクト）
    # return 301 https://example.com$request_uri;

    # STEP A の間だけ: 動作確認用にコンテナへ通す（Certbot 成功後に削除可）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


